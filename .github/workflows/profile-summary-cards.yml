name: Refresh GitHub Profile Statistics

on:
  workflow_dispatch:
  schedule:
    - cron: "17 2 * * *" # Daily at 02:17 UTC; GitHub schedule timing can be delayed.

permissions:
  contents: write

jobs:
  refresh-profile-cards:
    if: github.repository == 'raviffg/raviffg'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout profile repository
        uses: actions/checkout@v4

      - name: Generate summary charts and commit them
        uses: vn7n24fzkq/github-profile-summary-cards@release
        env:
          GITHUB_TOKEN: ${{ secrets.SUMMARY_GITHUB_TOKEN }}
        with:
          USERNAME: raviffg
          BRANCH_NAME: main
          THEME: tokyonight
          ANIMATION: none
          AUTO_PUSH: true
